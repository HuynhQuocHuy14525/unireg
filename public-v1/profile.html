<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông tin cá nhân – UniReg</title><link rel="stylesheet" href="app.css"></head>
<body data-page="profile"><header class="top" id="hdr"></header>
<main id="main" class="wrap"><h1 tabindex="-1">Thông tin cá nhân</h1><p class="sub">Cập nhật thông tin liên lạc để nhận thông báo từ Phòng Đào tạo</p>
<div id="msg" class="alert"></div>
<form id="pf" class="card" novalidate>
<input id="name" name="name" placeholder="Họ tên" autocomplete="name" aria-describedby="name-err"><p id="name-err" class="field-err"></p>
<input id="email" name="email" type="text" placeholder="Email" autocomplete="email" aria-describedby="email-err"><p id="email-err" class="field-err"></p>
<input id="phone" name="phone" type="text" placeholder="SĐT" inputmode="numeric" autocomplete="tel" aria-describedby="phone-hint phone-err"><p id="phone-err" class="field-err"></p>
<input id="dob" name="dob" type="date">
<div class="actions"><button class="btn btn-primary" type="submit">Save</button></div></form>
