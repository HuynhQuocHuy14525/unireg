<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông tin cá nhân – UniReg</title><link rel="stylesheet" href="app.css"></head>
<body data-page="profile"><header class="top" id="hdr"></header>
<main id="main" class="wrap"><h1 tabindex="-1">Thông tin cá nhân</h1><p class="sub">Cập nhật thông tin liên lạc để nhận thông báo từ Phòng Đào tạo</p>
<div id="msg" class="alert" role="status" aria-live="polite"></div>
<form id="pf" class="card" novalidate>
<label for="name">Họ và tên</label><input id="name" name="name" autocomplete="name" aria-describedby="name-err"><p id="name-err" class="field-err"></p>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-err"><p id="email-err" class="field-err"></p>
<label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" aria-describedby="phone-hint phone-err"><p id="phone-hint" class="hint">10 chữ số, bắt đầu bằng 0</p><p id="phone-err" class="field-err"></p>
<label for="dob">Ngày sinh</label><input id="dob" name="dob" type="date">
<div class="actions"><button class="btn btn-primary" type="submit">Lưu thay đổi</button></div></form>
