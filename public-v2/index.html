<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập – UniReg</title><link rel="stylesheet" href="app.css"></head>
<body data-page="login"><header class="top"><div class="wrap"><span class="brand"><img src="logo.svg" alt="" width="40" height="40">UniReg</span></div></header>
<main id="main" class="wrap"><div class="card login"><h1>Đăng nhập</h1><p class="sub">Cổng đăng ký học phần dành cho sinh viên</p>
<div id="msg" class="alert" role="alert"></div>
<form id="loginForm" novalidate>
<label for="mssv">Mã số sinh viên (MSSV)</label><input id="mssv" name="mssv" inputmode="numeric" autocomplete="username" maxlength="8" aria-describedby="mssv-hint" autofocus>
<p id="mssv-hint" class="hint">Gồm đúng 8 chữ số</p>
<label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password">
<div class="actions"><button id="btnLogin" class="btn btn-primary" type="submit">Đăng nhập</button></div>
</form><p class="hint">Quên mật khẩu? Liên hệ Phòng Đào tạo để được cấp lại.</p></div></main>
<footer><div class="wrap"><a href="huong-dan.html">Hướng dẫn sử dụng</a><a href="mailto:daotao@unireg.edu.vn">Liên hệ Phòng Đào tạo</a><p>© 2026 UniReg – Ứng dụng mẫu phục vụ học tập môn Đảm bảo chất lượng và kiểm thử phần mềm.</p></div></footer><script src="app.js"></script></body></html>
